<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, Segoe UI, sans-serif" font-size="14">
  <rect width="640" height="300" rx="10" fill="#f6f5f0"/>
  <!-- 1. straight run -->
  <text x="20" y="28" font-weight="600" fill="#222">1  Straight run</text>
  <line x1="40" y1="110" x2="250" y2="110" stroke="#3987e5" stroke-width="4"/>
  <path d="M250 110 l-12 -8 v16z" fill="#3987e5"/>
  <circle cx="40" cy="110" r="9" fill="#d99a00"/>
  <rect x="236" y="98" width="22" height="24" rx="4" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="40" y1="150" x2="250" y2="150" stroke="#444" stroke-width="1.5"/>
  <line x1="40" y1="143" x2="40" y2="157" stroke="#444" stroke-width="1.5"/>
  <line x1="250" y1="143" x2="250" y2="157" stroke="#444" stroke-width="1.5"/>
  <text x="95" y="174" fill="#222">tape: mark to the wheel centres</text>
  <text x="20" y="214" fill="#555">Mark under the wheel centres,</text>
  <text x="20" y="234" fill="#555">robot drives 2 m, you type the tape.</text>
  <!-- 2. square -->
  <text x="330" y="28" font-weight="600" fill="#222">2  Square, clockwise, then counter-clockwise</text>
  <rect x="380" y="60" width="150" height="150" fill="none" stroke="#bbb" stroke-dasharray="4 4"/>
  <path d="M380 210 V60 H530 V210 H380" fill="none" stroke="#3987e5" stroke-width="4"/>
  <path d="M380 140 l-8 12 h16z" fill="#3987e5"/>
  <path d="M455 60 l-12 -8 v16z" fill="#3987e5" transform="rotate(0 455 60)"/>
  <circle cx="380" cy="210" r="9" fill="#d99a00"/>
  <text x="392" y="232" fill="#222">start mark = finish mark</text>
  <!-- where the robot really ended -->
  <rect x="402" y="188" width="22" height="24" rx="4" fill="none" stroke="#d95926" stroke-width="2.5"/>
  <line x1="380" y1="210" x2="413" y2="200" stroke="#d95926" stroke-width="2"/>
  <text x="430" y="186" fill="#d95926">measure this:</text>
  <text x="430" y="203" fill="#d95926">ahead + left, in cm</text>
  <text x="330" y="262" fill="#555">1 m sides. Robot's first heading = "ahead".</text>
  <text x="330" y="282" fill="#555">Type how far it ended from the mark; 0 if on it.</text>
</svg>
