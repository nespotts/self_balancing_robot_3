; Self-balancing robot v4 firmware - Teensy 4.1. See docs/firmware.md and README.md.
[platformio]
default_envs = teensy41_wifi

; USB: Teensy plugged into this PC.  pio run -e teensy41 -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
monitor_speed = 115200
upload_protocol = teensy-cli
build_src_flags = -Wall
lib_deps =
	Wire
	SPI
	robtillaart/AS5600@^0.6.0
	adafruit/Adafruit BusIO@^1.15.0
	thomasfredericks/Bounce2@^2.72
	adafruit/Adafruit_VL53L0X@^1.1.2
	nrf24/RF24@^1.4.7

; Wi-Fi (default): build here, flash the Teensy plugged into the robot's Orange Pi.
;   pio run -t upload          ROBOT_HOST=<ssh host> (default robot), ROBOT_FLASH_DRY_RUN=1 = checks only
[env:teensy41_wifi]
extends = env:teensy41
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/wifi_upload.py" "$SOURCE"

; ---- v9 crash bisect variants (issue #109 follow-up), all flashed over Wi-Fi like teensy41_wifi ----
;   pio run -e <env> -t upload       (build only: pio run -e <env>; hex in .pio/build/<env>/firmware.hex)
; Every variant has the crash capture: after a reset the "reset: ..." lines name the previous run's last phases,
; whether the RTWDOG interrupt ran, and for a fault PC / LR / SP / CFSR / HFSR / BFAR / MMFAR.
; The boot log's "build: ..." line shows the switches. Defaults (= the fix) are in src/config.h.

; E: v9 as it was (SNVS marker every second, RTWDOG refreshed every background pass) + crash capture.
;    Should still crash: the reset lines then say where.
[env:v9diag]
extends = env:teensy41_wifi
build_flags = -DSBR_SNVS_MARKER=1 -DSBR_WDT_FEED_EVERY_PASS=1

; A: the fix (no SNVS accesses at run time, RTWDOG refresh <= 1 kHz, RTWDOG ISR fallback reset, own fault handler)
[env:fix]
extends = env:teensy41_wifi

; B: A without the hardware watchdog (RTWDOG never touched)
[env:fix_nowdt]
extends = env:teensy41_wifi
build_flags = -DSBR_WDOG_ENABLE=0

; C: A with plain Wire encoder reads (v8 style), no bounded driver, no bus recovery
[env:fix_wire]
extends = env:teensy41_wifi
build_flags = -DSBR_I2C_BOUNDED=0

; D: A + the v9 SNVS marker written every second (tests the SNVS hypothesis alone)
[env:fix_snvs]
extends = env:teensy41_wifi
build_flags = -DSBR_SNVS_MARKER=1

; F: A + the v9 RTWDOG refresh on every background pass (tests the refresh-rate hypothesis alone)
[env:fix_feedall]
extends = env:teensy41_wifi
build_flags = -DSBR_WDT_FEED_EVERY_PASS=1

; G: A without startup_early_hook
[env:fix_nohook]
extends = env:teensy41_wifi
build_flags = -DSBR_EARLY_HOOK=0
